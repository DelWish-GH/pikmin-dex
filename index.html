<!DOCTYPE html>
<html lang="zh-TW">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>皮克敏飾品收集圖鑑</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <script src="https://unpkg.com/vue@3/dist/vue.global.prod.js"></script>
  
  <!-- Firebase SDK (相容模式 CDN，最適合單檔案 HTML) -->
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-auth-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore-compat.js"></script>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Lato:wght@400;700&family=Noto+Sans+TC:wght@400;500;700;900&display=swap" rel="stylesheet">

  <style>
    body { font-family: 'Lato', 'Noto Sans TC', sans-serif; background-color: #f7f5f0; -webkit-tap-highlight-color: transparent; }
    .pc-card { background: white; border-radius: 16px; border: 1px solid #e5e7eb; padding: 1rem; position: relative; overflow: hidden; box-shadow: 0 1px 3px rgba(27,67,50,.07); }
    .pc-card::before { content: ''; position: absolute; left: 0; top: 0; bottom: 0; width: 4px; }
    .type-normal::before { background: linear-gradient(to bottom, #52b788, #2d6a4f); }
    .type-event::before  { background: linear-gradient(to bottom, #fbbf24, #d97706); }
    .type-special::before{ background: linear-gradient(to bottom, #c084fc, #9333ea); }
    .pc-card.is-done { background: linear-gradient(135deg, #ffffff 0%, #fffdf5 55%, #fffbeb 100%); border-color: #fde68a; }
    .pc-card.is-done::before { background: linear-gradient(to bottom, #fbbf24, #f59e0b, #d97706); }
    @keyframes pc-gold-pulse { 0%, 100% { box-shadow: 0 0 3px rgba(251,191,36,.3); } 50% { box-shadow: 0 0 8px rgba(251,191,36,.75); } }
    .pc-bar-done { background: linear-gradient(90deg, #d97706, #fbbf24, #fde68a) !important; animation: pc-gold-pulse 2.2s ease-in-out infinite; }
  </style>
</head>
<body class="antialiased min-h-screen pb-16">
  <div id="app">

    <!-- 頂部導航列 -->
    <header class="sticky top-0 z-40 bg-gradient-to-b from-[#0f2d17] to-[#1a3d22] shadow-lg text-white">
      <div class="max-w-[512px] mx-auto px-4 py-3">
        <div class="flex items-center justify-between mb-2.5">
          <h1 class="text-base font-bold text-[#d8f3dc] tracking-wide">皮克敏飾品收集圖鑑</h1>
          
          <div class="flex items-center gap-2.5">
            <!-- 圓環總進度率 -->
            <div class="flex items-center gap-1.5 bg-white/10 rounded-full px-2.5 py-1 border border-white/10">
              <div class="relative w-6 h-6">
                <svg class="w-6 h-6 -rotate-90">
                  <circle cx="12" cy="12" r="9" fill="none" stroke="rgba(255,255,255,0.15)" stroke-width="2.5"></circle>
                  <circle cx="12" cy="12" r="9" fill="none" stroke="#52b788" stroke-width="2.5"
                          :stroke-dasharray="56.5" :stroke-dashoffset="56.5 - (56.5 * totalProgressPercent / 100)"
                          stroke-linecap="round" class="transition-all duration-500"></circle>
                </svg>
                <span class="absolute inset-0 flex items-center justify-center text-[9px] font-bold text-[#d8f3dc]">
                  {{ totalProgressPercent }}%
                </span>
              </div>
              <span class="text-[10px] text-white/70 font-mono">
                {{ collectedDecorCount }}<span class="opacity-40">/{{ totalDecorSlots }}</span>
              </span>
            </div>

            <!-- 登入狀態 / Google 帳號頭像按鈕 -->
            <div v-if="currentUser" class="flex items-center gap-1.5">
              <span class="text-[10px] text-emerald-300">{{ isSyncing ? '同步中...' : '已同步' }}</span>
              <button @click="handleLogout" title="點擊登出" class="relative group">
                <img :src="currentUser.photoURL || 'https://www.gravatar.com/avatar/?d=mp'" 
                     class="w-7 h-7 rounded-full border-2 border-emerald-400 group-hover:border-red-400 transition" alt="Avatar">
              </button>
            </div>
            <button v-else @click="handleLogin" 
                    class="text-[11px] bg-white text-stone-800 font-bold px-2.5 py-1 rounded-full shadow hover:bg-stone-100 transition flex items-center gap-1">
              <span>G</span> 登入同步
            </button>
          </div>
        </div>

        <!-- 搜尋列 -->
        <div class="mb-2">
          <div class="relative">
            <svg class="absolute left-3 top-1/2 -translate-y-1/2 w-4 h-4 text-stone-400" fill="none" viewBox="0 0 24 24" stroke="currentColor">
              <circle cx="11" cy="11" r="8" stroke-width="2"></circle>
              <line x1="21" y1="21" x2="16.65" y2="16.65" stroke-width="2" stroke-linecap="round"></line>
            </svg>
            <input v-model="searchQuery" type="text" placeholder="搜尋類別、飾品或備註名稱..."
                   class="w-full pl-9 pr-4 py-2 bg-white text-stone-800 rounded-xl text-xs placeholder-stone-400 focus:outline-none focus:ring-2 focus:ring-emerald-400 border border-stone-200 shadow-inner">
          </div>
        </div>

        <!-- 集齊狀態過濾 -->
        <div class="flex gap-1.5">
          <button v-for="tab in statusTabs" :key="tab.value"
                  @click="currentStatusFilter = tab.value"
                  :class="currentStatusFilter === tab.value ? 'bg-white/30 text-white shadow-sm' : 'bg-white/10 text-white/50 hover:text-white'"
                  class="flex-1 py-1 rounded-md text-[11px] font-bold transition">
            {{ tab.label }}
          </button>
        </div>
      </div>
    </header>

    <!-- 主要內容區 -->
    <main class="max-w-[512px] mx-auto px-4 pt-3">
      <!-- 4 態圖例說明 -->
      <div class="bg-white rounded-xl border border-stone-200 p-3 mb-3 shadow-sm">
        <div class="flex justify-around items-center">
          <div class="flex flex-col items-center gap-0.5">
            <div class="w-9 h-9 rounded-full border-2 border-stone-300 bg-stone-300 flex items-center justify-center grayscale"><span class="text-xs">🌱</span></div>
            <span class="text-[10px] text-stone-500 font-medium">0: 未持有</span>
          </div>
          <div class="flex flex-col items-center gap-0.5">
            <div class="relative w-9 h-9 rounded-full border-2 border-red-400 bg-red-400/60 flex items-center justify-center">
              <div class="absolute -top-1 -right-1 w-4 h-4 bg-lime-400 rounded-full flex items-center justify-center border border-white text-[9px]">🌱</div>
            </div>
            <span class="text-[10px] text-stone-500 font-medium">1: 苗</span>
          </div>
          <div class="flex flex-col items-center gap-0.5">
            <div class="relative w-9 h-9 rounded-full border-2 border-red-500 bg-red-500 flex items-center justify-center">
              <div class="absolute -top-1 -right-1 w-4 h-4 bg-amber-400 rounded-full flex items-center justify-center border border-white text-[9px]">🥚</div>
            </div>
            <span class="text-[10px] text-stone-500 font-medium">2: 已孵出</span>
          </div>
          <div class="flex flex-col items-center gap-0.5">
            <div class="relative w-9 h-9 rounded-full border-2 border-green-600 bg-red-500 ring-2 ring-emerald-200 flex items-center justify-center">
              <div class="absolute -top-1 -right-1 w-4 h-4 bg-emerald-500 rounded-full flex items-center justify-center border border-white text-white text-[8px] font-bold">✓</div>
            </div>
            <span class="text-[10px] text-stone-500 font-medium">3: 飾品</span>
          </div>
        </div>
      </div>

      <!-- 載入中狀態 -->
      <div v-if="isLoading" class="flex flex-col items-center justify-center py-16 text-stone-500 gap-3">
        <svg class="animate-spin h-8 w-8 text-emerald-600" fill="none" viewBox="0 0 24 24">
          <circle class="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" stroke-width="4"></circle>
          <path class="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8v8H4z"></path>
        </svg>
        <span class="text-xs font-bold tracking-wider">正在載入圖鑑資料庫...</span>
      </div>

      <!-- 圖鑑清單 -->
      <div v-else class="flex flex-col gap-3">
        <div v-for="item in filteredDecorList" :key="item.id"
             :class="['pc-card', `type-${item.category}`, isCardComplete(item) ? 'is-done' : '']">
          
          <div class="flex items-center justify-between mb-1">
            <div class="flex items-center gap-1.5 min-w-0">
              <span class="text-lg">{{ item.icon || '🌿' }}</span>
              <span class="font-bold text-stone-800 text-sm truncate">{{ item.name }}</span>
              <span :class="getCategoryBadgeClass(item.category)" class="text-[10px] px-1.5 py-0.5 rounded-full font-semibold shrink-0">
                {{ getCategoryLabel(item.category) }}
              </span>
            </div>

            <div class="flex items-center gap-2 shrink-0">
              <template v-if="isCardComplete(item)">
                <span class="inline-flex items-center gap-1 text-[11px] font-bold text-amber-700 bg-amber-50 border border-amber-200 rounded-full px-2 py-0.5">
                  ✨ 完成
                </span>
              </template>
              <template v-else>
                <button @click="fillCard(item)"
                        class="text-[10px] px-2 py-0.5 bg-emerald-50 text-emerald-700 border border-emerald-200 rounded-md hover:bg-emerald-100 transition">
                  填滿
                </button>
                <span class="font-mono text-xs font-bold text-stone-500">
                  {{ getCardProgress(item).collected }}/{{ getCardProgress(item).total }}
                </span>
              </template>
            </div>
          </div>

          <p class="text-[11px] text-stone-400 mb-2 pl-6">{{ item.desc }}</p>

          <div class="w-full h-1.5 bg-stone-100 rounded-full overflow-hidden mb-3">
            <div :class="isCardComplete(item) ? 'pc-bar-done' : 'bg-gradient-to-r from-emerald-700 to-emerald-400'"
                 class="h-full rounded-full transition-all duration-300"
                 :style="{ width: `${getCardProgress(item).percent}%` }"></div>
          </div>

          <!-- 分組顯示 -->
          <div v-if="item.groups" class="flex flex-col gap-2.5">
            <div v-for="group in item.groups" :key="group.id">
              <div class="flex items-center gap-1.5 mb-1.5">
                <span :class="group.id === 'rare' ? 'bg-amber-500' : 'bg-emerald-500'" class="w-1.5 h-1.5 rounded-full"></span>
                <span class="text-[11px] font-medium text-stone-600">{{ group.name }}</span>
              </div>
              <div class="flex flex-wrap gap-2 justify-start">
                <button v-for="color in group.pikmins" :key="color"
                        @click="cyclePikminStatus(item.id, group.id, color)"
                        class="flex flex-col items-center gap-0.5">
                  <div class="relative w-10 h-10 rounded-full border-2 flex items-center justify-center transition-all"
                       :style="getPikminCircleStyle(item.id, group.id, color)">
                    <svg viewBox="0 0 24 24" class="w-4 h-4 absolute -top-2" :class="getPikminStatus(item.id, group.id, color) === 0 ? 'opacity-30' : 'opacity-100'">
                      <path d="M12 2C8 2 6 6 6 8c0 2 2 4 6 4s6-2 6-4c0-2-2-6-6-6z" :fill="getPikminStatus(item.id, group.id, color) === 0 ? '#9ca3af' : '#48bb78'" stroke="#2f855a" stroke-width="0.5"></path>
                      <line x1="12" y1="8" x2="12" y2="14" stroke="#2f855a" stroke-width="1"></line>
                    </svg>
                    <div class="flex gap-1.5 mt-1">
                      <div class="w-1.5 h-2 rounded-full" :class="getPikminStatus(item.id, group.id, color) === 0 ? 'bg-stone-500' : 'bg-stone-900'"></div>
                      <div class="w-1.5 h-2 rounded-full" :class="getPikminStatus(item.id, group.id, color) === 0 ? 'bg-stone-500' : 'bg-stone-900'"></div>
                    </div>
                    <div v-if="getPikminStatus(item.id, group.id, color) === 1" class="absolute -top-1 -right-1 w-4 h-4 bg-lime-400 rounded-full flex items-center justify-center border border-white text-[9px] shadow-sm">🌱</div>
                    <div v-else-if="getPikminStatus(item.id, group.id, color) === 2" class="absolute -top-1 -right-1 w-4 h-4 bg-amber-400 rounded-full flex items-center justify-center border border-white text-[9px] shadow-sm">🥚</div>
                    <div v-else-if="getPikminStatus(item.id, group.id, color) === 3" class="absolute -top-1 -right-1 w-4 h-4 bg-emerald-500 rounded-full flex items-center justify-center border border-white text-white text-[8px] font-bold shadow-sm">✓</div>
                  </div>
                  <span class="text-[10px] font-bold leading-tight" :style="{ color: pikminColorMeta[color]?.textColor }">{{ pikminColorMeta[color]?.label || color }}</span>
                  <span class="text-[8px] leading-tight" :class="getStatusTextColorClass(getPikminStatus(item.id, group.id, color))">
                    {{ getStatusText(getPikminStatus(item.id, group.id, color)) }}
                  </span>
                </button>
              </div>
            </div>
          </div>

          <!-- 無分組顯示 -->
          <div v-else class="flex flex-wrap gap-2 justify-center">
            <button v-for="color in item.pikmins" :key="color"
                    @click="cyclePikminStatus(item.id, null, color)"
                    class="flex flex-col items-center gap-0.5">
              <div class="relative w-10 h-10 rounded-full border-2 flex items-center justify-center transition-all"
                   :style="getPikminCircleStyle(item.id, null, color)">
                <svg viewBox="0 0 24 24" class="w-4 h-4 absolute -top-2" :class="getPikminStatus(item.id, null, color) === 0 ? 'opacity-30' : 'opacity-100'">
                  <path d="M12 2C8 2 6 6 6 8c0 2 2 4 6 4s6-2 6-4c0-2-2-6-6-6z" :fill="getPikminStatus(item.id, null, color) === 0 ? '#9ca3af' : '#48bb78'" stroke="#2f855a" stroke-width="0.5"></path>
                  <line x1="12" y1="8" x2="12" y2="14" stroke="#2f855a" stroke-width="1"></line>
                </svg>
                <div class="flex gap-1.5 mt-1">
                  <div class="w-1.5 h-2 rounded-full" :class="getPikminStatus(item.id, null, color) === 0 ? 'bg-stone-500' : 'bg-stone-900'"></div>
                  <div class="w-1.5 h-2 rounded-full" :class="getPikminStatus(item.id, null, color) === 0 ? 'bg-stone-500' : 'bg-stone-900'"></div>
                </div>
                <div v-if="getPikminStatus(item.id, null, color) === 1" class="absolute -top-1 -right-1 w-4 h-4 bg-lime-400 rounded-full flex items-center justify-center border border-white text-[9px] shadow-sm">🌱</div>
                <div v-else-if="getPikminStatus(item.id, null, color) === 2" class="absolute -top-1 -right-1 w-4 h-4 bg-amber-400 rounded-full flex items-center justify-center border border-white text-[9px] shadow-sm">🥚</div>
                <div v-else-if="getPikminStatus(item.id, null, color) === 3" class="absolute -top-1 -right-1 w-4 h-4 bg-emerald-500 rounded-full flex items-center justify-center border border-white text-white text-[8px] font-bold shadow-sm">✓</div>
              </div>
              <span class="text-[10px] font-bold leading-tight" :style="{ color: pikminColorMeta[color]?.textColor }">{{ pikminColorMeta[color]?.label || color }}</span>
              <span class="text-[8px] leading-tight" :class="getStatusTextColorClass(getPikminStatus(item.id, null, color))">
                {{ getStatusText(getPikminStatus(item.id, null, color)) }}
              </span>
            </button>
          </div>

        </div>
      </div>
    </main>
  </div>

  <script>
    // 🌟 1. 填入你的 Gist Raw 網址
    const DEX_GIST_URL = 'https://gist.githubusercontent.com/DelWish-GH/f4080c092fd81b66c71d80dc11a0883f/raw/pikmin_dex.json';

    // 🌟 2. 填入 Firebase Console 取得的設定
    const firebaseConfig = {
		  apiKey: "AIzaSyBF7r0qiC57xnnCW3CVsGfs38g6l-aWw4o",
		  authDomain: "pikmin-user-dex.firebaseapp.com",
		  projectId: "pikmin-user-dex",
		  storageBucket: "pikmin-user-dex.firebasestorage.app",
		  messagingSenderId: "971963108460",
		  appId: "1:971963108460:web:e5d5959de995444afb1c49"
		};

    // 初始化 Firebase
    firebase.initializeApp(firebaseConfig);
    const auth = firebase.auth();
    const db = firebase.firestore();

    const { createApp, ref, computed, onMounted } = Vue;

    createApp({
      setup() {
        const pikminColorMeta = {
          red:    { label: '紅', bg: 'rgb(229, 62, 62)',   textColor: 'rgb(220, 38, 38)' },
          yellow: { label: '黃', bg: 'rgb(236, 201, 75)',  textColor: 'rgb(202, 138, 4)' },
          blue:   { label: '藍', bg: 'rgb(49, 130, 206)',  textColor: 'rgb(37, 99, 235)' },
          white:  { label: '白', bg: 'rgb(226, 232, 240)', textColor: 'rgb(100, 116, 139)' },
          purple: { label: '紫', bg: 'rgb(128, 90, 213)', textColor: 'rgb(147, 51, 234)' },
          rock:   { label: '岩', bg: 'rgb(160, 174, 192)', textColor: 'rgb(71, 85, 105)' },
          wing:   { label: '翅', bg: 'rgb(237, 100, 166)', textColor: 'rgb(219, 39, 119)' },
          ice:    { label: '冰', bg: 'rgb(103, 232, 249)', textColor: 'rgb(6, 182, 212)' }
        };

        const decorDatabase = ref([]);
        const progressMap = ref({});
        const currentStatusFilter = ref('all');
        const searchQuery = ref('');
        const isLoading = ref(true);
        const currentUser = ref(null);
        const isSyncing = ref(false);

        const statusTabs = [
          { label: '全部', value: 'all' },
          { label: '未集齊', value: 'incomplete' },
          { label: '已集齊', value: 'completed' }
        ];

        // 登入 / 登出處理
        const handleLogin = async () => {
          const provider = new firebase.auth.GoogleAuthProvider();
          try {
            await auth.signInWithPopup(provider);
          } catch (e) {
            console.error('Login failed:', e);
            alert('登入失敗：' + e.message);
          }
        };

        const handleLogout = async () => {
          if (confirm('確定要登出嗎？')) {
            await auth.signOut();
            progressMap.value = {};
            localStorage.removeItem('pikmin_dex_progress');
          }
        };

        // 儲存進度（同時寫入 LocalStorage 與 Firestore 雲端）
        let saveTimeout = null;
        const saveProgress = () => {
          localStorage.setItem('pikmin_dex_progress', JSON.stringify(progressMap.value));

          if (currentUser.value) {
            isSyncing.value = true;
            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(async () => {
              try {
                await db.collection('user_progress').doc(currentUser.value.uid).set({
                  progress: progressMap.value,
                  updatedAt: firebase.firestore.FieldValue.serverTimestamp()
                });
              } catch (e) {
                console.error('Cloud sync error:', e);
              } finally {
                isSyncing.value = false;
              }
            }, 600); // 避免頻繁點擊過度寫入
          }
        };

        // 監聽 Auth 狀態與拉取雲端存檔
        onMounted(async () => {
          // 1. 先讀取本地快取
          const saved = localStorage.getItem('pikmin_dex_progress');
          if (saved) {
            try { progressMap.value = JSON.parse(saved); } catch (e) {}
          }

          // 2. 監聽 Google 登入狀態
          auth.onAuthStateChanged(async (user) => {
            currentUser.value = user;
            if (user) {
              try {
                const doc = await db.collection('user_progress').doc(user.uid).get();
                if (doc.exists && doc.data().progress) {
                  // 雲端進度優先覆蓋或合併
                  progressMap.value = { ...progressMap.value, ...doc.data().progress };
                  localStorage.setItem('pikmin_dex_progress', JSON.stringify(progressMap.value));
                } else {
                  // 若雲端無資料，則將現有本地進度上傳
                  saveProgress();
                }
              } catch (e) {
                console.error('Fetch cloud progress failed:', e);
              }
            }
          });

          // 3. 載入 Gist 圖鑑資料
			try {
			  const res = await fetch(DEX_GIST_URL);
			  const textData = await res.text();
			  
			  // 自動清理陣列及物件結尾多餘的逗號 (Trailing Commas)
			  const cleanedText = textData
				.replace(/,\s*\]/g, ']')
				.replace(/,\s*\}/g, '}');

			  const data = JSON.parse(cleanedText);
			  decorDatabase.value = Array.isArray(data) ? data : (data.content || []);
			} catch (e) {
			  console.error('Gist fetch error:', e);
			} finally {
			  isLoading.value = false;
			}
        });

        const getKey = (decorId, groupId, color) => groupId ? `${decorId}_${groupId}_${color}` : `${decorId}_${color}`;
        const getPikminStatus = (decorId, groupId, color) => progressMap.value[getKey(decorId, groupId, color)] || 0;

        const cyclePikminStatus = (decorId, groupId, color) => {
          const key = getKey(decorId, groupId, color);
          const current = progressMap.value[key] || 0;
          progressMap.value[key] = (current + 1) % 4;
          saveProgress();
        };

        const fillCard = (item) => {
          if (item.groups) {
            item.groups.forEach(g => g.pikmins.forEach(c => progressMap.value[getKey(item.id, g.id, c)] = 3));
          } else if (item.pikmins) {
            item.pikmins.forEach(c => progressMap.value[getKey(item.id, null, c)] = 3);
          }
          saveProgress();
        };

        const getCardProgress = (item) => {
          let total = 0, collected = 0;
          if (item.groups) {
            item.groups.forEach(g => {
              total += g.pikmins.length;
              g.pikmins.forEach(c => { if (getPikminStatus(item.id, g.id, c) === 3) collected++; });
            });
          } else if (item.pikmins) {
            total = item.pikmins.length;
            item.pikmins.forEach(c => { if (getPikminStatus(item.id, null, c) === 3) collected++; });
          }
          const percent = total > 0 ? Math.round((collected / total) * 100) : 0;
          return { collected, total, percent };
        };

        const isCardComplete = (item) => {
          const p = getCardProgress(item);
          return p.total > 0 && p.collected === p.total;
        };

        const getPikminCircleStyle = (decorId, groupId, color) => {
          const status = getPikminStatus(decorId, groupId, color);
          const meta = pikminColorMeta[color] || { bg: '#cbd5e1' };
          if (status === 0) return { backgroundColor: 'rgb(209, 213, 219)', borderColor: 'rgb(156, 163, 175)', filter: 'grayscale(100%)' };
          if (status === 1) return { backgroundColor: meta.bg, borderColor: meta.bg, opacity: 0.65 };
          if (status === 2) return { backgroundColor: meta.bg, borderColor: meta.bg, opacity: 1 };
          return { backgroundColor: meta.bg, borderColor: 'rgb(22, 163, 74)', boxShadow: '0 0 0 2px rgb(187, 247, 208)', opacity: 1 };
        };

        const getStatusText = (status) => ['—', '苗', '孵出', '飾品'][status] || '—';
        const getStatusTextColorClass = (status) => ['text-stone-400', 'text-lime-600 font-medium', 'text-amber-600 font-medium', 'text-emerald-600 font-bold'][status];
        const getCategoryLabel = (category) => ({ normal: '一般', event: '活動', special: '特殊' }[category] || '');
        const getCategoryBadgeClass = (category) => ({
          normal: 'bg-emerald-100 text-emerald-800', event: 'bg-amber-100 text-amber-800', special: 'bg-purple-100 text-purple-800'
        }[category] || 'bg-stone-100 text-stone-700');

        const totalDecorSlots = computed(() => {
          let count = 0;
          decorDatabase.value.forEach(item => {
            if (item.groups) item.groups.forEach(g => count += g.pikmins.length);
            else if (item.pikmins) count += item.pikmins.length;
          });
          return count;
        });

        const collectedDecorCount = computed(() => {
          let count = 0;
          decorDatabase.value.forEach(item => {
            if (item.groups) {
              item.groups.forEach(g => g.pikmins.forEach(c => { if (getPikminStatus(item.id, g.id, c) === 3) count++; }));
            } else if (item.pikmins) {
              item.pikmins.forEach(c => { if (getPikminStatus(item.id, null, c) === 3) count++; });
            }
          });
          return count;
        });

        const totalProgressPercent = computed(() => totalDecorSlots.value === 0 ? 0 : Math.round((collectedDecorCount.value / totalDecorSlots.value) * 100));

        const filteredDecorList = computed(() => {
          return decorDatabase.value.filter(item => {
            const complete = isCardComplete(item);
            if (currentStatusFilter.value === 'completed' && !complete) return false;
            if (currentStatusFilter.value === 'incomplete' && complete) return false;
            if (searchQuery.value.trim() !== '') {
              const query = searchQuery.value.toLowerCase();
              const matchName = (item.name || '').toLowerCase().includes(query);
              const matchDesc = (item.desc || '').toLowerCase().includes(query);
              if (!matchName && !matchDesc) return false;
            }
            return true;
          });
        });

        return {
          pikminColorMeta, decorDatabase, progressMap, currentStatusFilter, searchQuery,
          statusTabs, isLoading, currentUser, isSyncing, handleLogin, handleLogout,
          totalDecorSlots, collectedDecorCount, totalProgressPercent, filteredDecorList,
          getPikminStatus, cyclePikminStatus, fillCard, getCardProgress, isCardComplete,
          getPikminCircleStyle, getStatusText, getStatusTextColorClass, getCategoryLabel, getCategoryBadgeClass
        };
      }
    }).mount('#app');
  </script>
</body>
</html>
